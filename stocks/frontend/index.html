<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Stock Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1> My Portfolio</h1>
  <button onclick="loadPortfolio()">Refresh</button>

  <div id="portfolio">
    <h2> Assets </h2>
    <p><strong>Buying Power:</strong> <span id="cash"></span></p>
    <p><strong>Portfolio Value:</strong> <span id="value"></span></p>

    <h2> Holdings</h2>
    <ul id="holdings"></ul>

    <h2> Transactions</h2>
    <ul id="transactions"></ul>
  </div>
  <section>
  <h2> Buy / Sell </h2>
  <input id="trade-symbol" placeholder="Ticker (ex: AAPL)">
  <input id="trade-shares" type="number" placeholder="Shares" min="1">
  <button onclick="buyStock()">Buy</button>
  <button onclick="sellStock()">Sell</button>
</section>
</body>
</html>

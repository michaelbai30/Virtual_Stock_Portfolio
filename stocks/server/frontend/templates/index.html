<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Stock Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>

  <section id="stock-chart">
      <h1> Stock Chart </h1>
        <input type="text" id="chart-symbol" placeholder="Enter ticker (ex: AAPL)">
          
          <div id="timeframes">
            <button onclick="loadChart('1d')"> 1d </button>
            <button onclick="loadChart('1w')"> 1w </button>
            <button onclick="loadChart('1m')"> 1m </button>
            <button onclick="loadChart('3m')"> 3m </button>
            <button onclick="loadChart('1y')"> 1y </button>
            <button onclick="loadChart('5y')"> 5y </button>
          </div>

          <div id="chart-container">
            <iframe id="chart-frame" style="width: 100%; height: 600px; border: none;"></iframe>
          </div>
   </section>
  <h1> My Portfolio</h1>
  <button onclick="loadPortfolio()">Refresh</button>

  <div id="portfolio">
    <h2> Assets </h2>
      <p><strong>Buying Power:</strong> <span id="cash"></span></p>
      <p><strong>Portfolio Value:</strong> <span id="value"></span></p>

    <h2> Holdings</h2>
      <ul id="holdings"></ul>

   <section id="portfolio-summary">
      <h2>PL and Allocations</h2>
        <div id="summary-data"></div>
   </section>

   

    <h2> Transactions</h2>
      <ul id="transactions"></ul>
  </div>

  <section>
    <h2> Buy / Sell </h2>
      <input id="trade-symbol" placeholder="Ticker (ex: AAPL)">
      <input id="trade-shares" type="number" placeholder="Shares" min="1">
      <button onclick="buyStock()">Buy</button>
      <button onclick="sellStock()">Sell</button>
  </section>
</body>
</html>
